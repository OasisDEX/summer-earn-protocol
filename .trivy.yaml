# Trivy configuration for Summer Earn Protocol
# Focuses on Infrastructure as Code (Terraform), Secrets, and Vulnerabilities

# Scan Options
scanners:
  - vuln
  - misconfig
  - secret

# Global Options
exit-code: 0
severity:
  - HIGH
  - CRITICAL
skip-dirs:
  - "packages/deployment/ignition/deployments/*"
  - "packages/deployment/artifacts/*"
  - "packages/external-dependencies/lib/pendle-core-v2-public/*"
  
include-dev-deps: false

# Reporting Options
format: table
output: trivy-report.txt

# Misconfiguration Scanning Settings
misconfig:
  include-non-failures: true
  exclude-paths:
    - .terraform
    - terraform.tfstate
    - "**/packages/deployment/ignition/deployments/**"
    - "**/packages/external-dependencies/lib/pendle-core-v2-public/**"

# Terraform Settings
terraform:
  # Paths to ignore or specific checks to skip
  # skip-checks:
  #   - AVD-AWS-001

# Secret Scanning Settings
secret:
  enabled: true
  # enable-builtin-rules:
  #   - aws-access-key-id
  #   - aws-secret-access-key
  #   - github-pat
  # allow-rules:
  #   - id: skip-report-file
  #     description: ignore the output report
  #     path: trivy-report.txt
