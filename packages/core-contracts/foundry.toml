[profile.default]
extra_output = ["devdoc", "userdoc"]
src = "src"
out = "out"
libs = [
  'lib'
]
allow_paths = ["../../node_modules"]
test = 'test'
cache_path  = 'cache_forge'
solc = "0.8.28"
evm_version = "cancun"
cbor_metadata = true
via_ir = false
optimizer = true
optimizer_runs = 50

# Fast settings for local dev / normal `pnpm test`. Override via FOUNDRY_FUZZ_RUNS
# or the `deep` profile (FOUNDRY_PROFILE=deep) for thorough runs.
[profile.default.fuzz]
runs = 64

[profile.default.invariant]
runs = 32
depth = 128

# Thorough settings for CI and pre-release auditing: `FOUNDRY_PROFILE=deep forge test`
# (or `pnpm test:deep`). Inherits everything else from the default profile.
[profile.deep.fuzz]
runs = 1024

[profile.deep.invariant]
runs = 256
depth = 500

[fmt]
  bracket_spacing = true
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "remove"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true
  sort_imports = true
  contract_new_lines = true

[rpc_endpoints]
# Testnets
sepolia = "${SEPOLIA_RPC_URL}"

# Mainnets
base = "${BASE_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
arbitrum= "${ARBITRUM_RPC_URL}"
sonic= "${SONIC_RPC_URL}"
optimism= "${OPTIMISM_RPC_URL}"
hyperliquid= "${HYPERLIQUID_RPC_URL}"

[etherscan]
sepolia = { key = "7KB7N6WAQJFFC2F5UP98RBTESZ11EK8X8W}" }
base = { key = "8M4JVVERCDQURGWJ6UIVQU23YNAQU9Y5PK"  }
#                   Paste TENDERLY_ACCESS_TOKEN            Chain ID         Verifier URL: RPC_URL/verify/etherscan
unknown_chain = { key = "${TENDERLY_ACCESS_KEY}", chain = 84537357, url = "${TENDERLY_VIRTUAL_TESTNET_RPC_URL}/verify/etherscan" }

[doc]
out = "docs/generated"
title = "Summer Earn Core Contracts"
repository = "https://github.com/OasisDEX/summer-earn-protocol"
ignore = ["**/mocks/**", "**/test/**"]
