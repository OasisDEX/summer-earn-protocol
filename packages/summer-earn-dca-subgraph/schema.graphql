type User @entity {
  "Owner address"
  id: Bytes!
  createdAt: BigInt!
  strategies: [Strategy!]! @derivedFrom(field: "owner")
}

type Strategy @entity {
  "strategyId.toString()"
  id: String!
  strategyId: BigInt!
  owner: User!

  sourceVault: Bytes!
  targetVault: Bytes!
  inAsset: Bytes!
  outAsset: Bytes!
  inAssetFeed: Bytes!
  outAssetFeed: Bytes!
  "Max acceptable age (seconds) of inAssetFeed; 0 means the contract default (MAX_ORACLE_STALENESS, 24h)."
  inAssetFeedStaleness: BigInt!
  "Max acceptable age (seconds) of outAssetFeed; 0 means the contract default (MAX_ORACLE_STALENESS, 24h)."
  outAssetFeedStaleness: BigInt!

  tradeAmount: BigInt!
  interval: BigInt!
  slippageBps: BigInt!
  "Ceiling on the 1e18-scaled out/in execution-price ratio (outPrice * 10**inOracleDec * 1e18 / (inPrice * 10**outOracleDec)). 0 means no ceiling."
  maxPrice: BigInt!
  "Floor on the 1e18-scaled out/in execution-price ratio (same formula as maxPrice). 0 means no floor."
  minPrice: BigInt!
  endDate: BigInt!
  maxTrades: BigInt!

  "ACTIVE | PAUSED | CANCELLED | COMPLETED"
  status: String!
  nextTriggerAt: BigInt!
  lastScheduledAt: BigInt!
  tradesExecuted: BigInt!

  totalInAssetSwapped: BigInt!
  totalOutAssetReceived: BigInt!

  createdAt: BigInt!
  createdAtBlock: BigInt!
  updatedAt: BigInt!
  updatedAtBlock: BigInt!

  executions: [Execution!]! @derivedFrom(field: "strategy")
}

type Execution @entity(immutable: true) {
  "{strategyId}-{txHashHex}-{logIndex}"
  id: String!
  strategy: Strategy!
  "Underlying in-asset amount consumed by this trade (`sourceVault.convertToAssets(inShares)` at execution time)."
  inAssets: BigInt!
  "Underlying out-asset amount delivered by this trade (`targetVault.convertToAssets(outShares)` at execution time)."
  outAssets: BigInt!
  "Source-vault share count pulled from the owner via Permit2 — equal to `config.tradeAmount`."
  inShares: BigInt!
  "Target-vault share count minted to the owner from the swap proceeds."
  outShares: BigInt!
  tradesExecutedAfter: BigInt!
  executionTimestamp: BigInt!
  blockNumber: BigInt!
  logIndex: Int!
  txHash: Bytes!
}

"""
A Chainlink price feed we index, keyed by the proxy address the user
references in `Strategy.in/outAssetFeed`. USDC/USD and ETH/USD are seeded
at deploy via static dataSources whose `startBlock` is pushed ~14 days
before the DCAStrategyManager deploy block, so the FE has a baseline price
history on day one. Every other feed begins indexing the block its address
first appears in `StrategyCreated`/`StrategyEdited` (see `registerFeed` in
src/common/initializers.ts).

The Chainlink proxy is just a forwarder — the actual `AnswerUpdated` event
fires from the underlying aggregator implementation. We track both: the
proxy address for `AggregatorConfirmed` (impl rotations), and the current
impl for `AnswerUpdated` (round stream). `aggregator` below reflects the
current impl.
"""
type PriceFeed @entity {
  "Aggregator proxy address — lowercased Bytes"
  id: Bytes!
  decimals: Int!
  description: String
  "Current aggregator implementation behind the proxy."
  aggregator: Bytes!
  firstSeenBlock: BigInt!
  firstSeenAt: BigInt!
  latestAnswer: BigInt!
  latestRoundId: BigInt!
  latestUpdatedAt: BigInt!
  rotations: [AggregatorRotation!]! @derivedFrom(field: "feed")
  rounds: [PriceRound!]! @derivedFrom(field: "feed")
}

"""
Logged whenever the proxy emits `AggregatorConfirmed(previous, latest)` —
i.e. Chainlink rotates the implementation behind the proxy. Lets the FE
mark the chart at the rotation block and is the audit trail for round
discontinuities.
"""
type AggregatorRotation @entity(immutable: true) {
  "{proxyAddrHex}-{blockNumber}-{logIndex}"
  id: String!
  feed: PriceFeed!
  previous: Bytes!
  latest: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

"""
One round per `AnswerUpdated` event observed from the current aggregator
implementation. `updatedAt` is the Chainlink-reported timestamp from the
event payload (NOT block timestamp). `id = {proxyAddrHex}-{roundId}` keeps
rounds stable across impl rotations.
"""
type PriceRound @entity(immutable: true) {
  "{proxyAddrHex}-{roundId}"
  id: String!
  feed: PriceFeed!
  roundId: BigInt!
  answer: BigInt!
  "Chainlink-reported `updatedAt` (seconds) from the event payload."
  updatedAt: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  logIndex: Int!
}
