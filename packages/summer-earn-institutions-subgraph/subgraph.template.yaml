specVersion: 0.0.8
schema:
  file: ./schema.graphql 
{{#enable-grafting}}
features:
  - grafting
graft:
  base: {{grafting-base}}
  block: {{grafting-block}}
{{/enable-grafting}}      
dataSources:
  - kind: ethereum/contract
    name: InstitutionalVaultRegistry
    network: {{network}}
    source:
      abi: InstitutionalVaultRegistry
      address: "{{registry-address}}"
      startBlock: {{registry-start-block}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
      abis:
        - name: InstitutionalVaultRegistry
          file: ./abis/InstitutionalVaultRegistry.abi.json
        - name: ConfigurationManager
          file: ./abis/ConfigurationManager.abi.json
        - name: ProtocolAccessManager
          file: ./abis/ProtocolAccessManager.abi.json
        - name: HarborCommand
          file: ./abis/HarborCommand.abi.json
        - name: FleetCommanderRewardsManager
          file: ./abis/FleetCommanderRewardsManager.abi.json          
        - name: Ark
          file: ./abis/Ark.abi.json
        - name: FleetCommander
          file: ./abis/FleetCommander.abi.json
        - name: ERC20
          file: ./abis/common/ERC20.json
        - name: OneInchOracle
          file: ./abis/oracles/one-inch-oracle.json
        - name: AaveV3Oracle
          file: ./abis/oracles/aave-v3-oracle.json
        - name: SdaiOracle
          file: ./abis/oracles/sdai-oracle.json
        - name: FeedRegistry
          file: ./abis/oracles/feed-registry.json
        - name: SusdeOracle
          file: ./abis/oracles/susde-oracle.json
        - name: SparkOracle
          file: ./abis/oracles/spark-oracle.json
        - name: AaveV2Oracle
          file: ./abis/oracles/aave-v2-price-oracle.json
        - name: EnsReverseResolver
          file: ./abis/ens/reverse-resolver.json
        - name: EnsRegistry
          file: ./abis/ens/registry.json
        - name: DefaultReverseNameResolver
          file: ./abis/ens/default-resolver.json
        - name: GovernanceRewardsManager
          file: ./abis/GovernanceRewardsManager.abi.json    
        - name: Multicall
          file: ./abis/common/Multicall.json
      eventHandlers:
        - event: InstitutionAdded(indexed bytes32,address,address,address)
          handler: handleInstitutionAdded
          receipt: true
        - event: InstitutionAdmiralsQuartersUpdated(indexed bytes32,address,address)
          handler: handleInstitutionAdmiralsQuartersUpdated
          receipt: true
        - event: InstitutionRemoved(indexed bytes32)
          handler: handleInstitutionRemoved
          receipt: true
      file: ./src/mappings/institutionalVaultRegistry.ts                
templates:
  - kind: ethereum/contract
    name: FleetCommanderTemplate
    network: {{network}}
    source:
      abi: FleetCommander
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
      abis:
        - name: Ark
          file: ./abis/Ark.abi.json
        - name: InstitutionalVaultRegistry
          file: ./abis/InstitutionalVaultRegistry.abi.json
        - name: ConfigurationManager
          file: ./abis/ConfigurationManager.abi.json
        - name: ProtocolAccessManager
          file: ./abis/ProtocolAccessManager.abi.json          
        - name: FleetCommander
          file: ./abis/FleetCommander.abi.json
        - name: FleetCommanderRewardsManager
          file: ./abis/FleetCommanderRewardsManager.abi.json
        - name: ERC20
          file: ./abis/common/ERC20.json
        - name: OneInchOracle
          file: ./abis/oracles/one-inch-oracle.json
        - name: AaveV3Oracle
          file: ./abis/oracles/aave-v3-oracle.json
        - name: SdaiOracle
          file: ./abis/oracles/sdai-oracle.json
        - name: FeedRegistry
          file: ./abis/oracles/feed-registry.json
        - name: SusdeOracle
          file: ./abis/oracles/susde-oracle.json
        - name: SparkOracle
          file: ./abis/oracles/spark-oracle.json
        - name: AaveV2Oracle
          file: ./abis/oracles/aave-v2-price-oracle.json
        - name: EnsReverseResolver
          file: ./abis/ens/reverse-resolver.json
        - name: EnsRegistry
          file: ./abis/ens/registry.json
        - name: DefaultReverseNameResolver
          file: ./abis/ens/default-resolver.json
        - name: GovernanceRewardsManager
          file: ./abis/GovernanceRewardsManager.abi.json   
        - name: SummerProtocolAccessManager
          file: ./abis/SummerProtocolAccessManager.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
          receipt: true
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
          receipt: true
        - event: Rebalanced(indexed address,(address,address,uint256,bytes,bytes)[])
          handler: handleRebalance
          receipt: true
        - event: ArkAdded(indexed address)
          handler: handleArkAdded
          receipt: true
        - event: ArkRemoved(indexed address)
          handler: handleArkRemoved
          receipt: true
        - event: FleetCommanderWithdrawnFromArks(indexed address,address,uint256)
          handler: handleFleetCommanderWithdrawnFromArks
          receipt: true
        - event: FleetCommanderRedeemedFromArks(indexed address,address,uint256)
          handler: handleFleetCommanderRedeemedFromArks
          receipt: true
        - event: FleetCommanderDepositCapUpdated(uint256)
          handler: handleFleetCommanderDepositCapUpdated
          receipt: true
        - event: FleetCommanderStakingRewardsUpdated(address)
          handler: handleFleetCommanderStakingRewardsUpdated
          receipt: true
        - event: FleetCommanderMaxRebalanceOperationsUpdated(uint256)
          handler: handleFleetCommanderMaxRebalanceOperationsUpdated
          receipt: true
        - event: FleetCommanderminimumBufferBalanceUpdated(uint256)
          handler: handleFleetCommanderMinimumBufferBalanceUpdated
          receipt: true      
        - event: TipAccrued(uint256)
          handler: handleTipAccrued
          receipt: true
        - event: TipRateUpdated(uint256)
          handler: handleTipRateUpdated
          receipt: true
        - event: WhitelistStatusUpdated(indexed address,bool)
          handler: handleWhitelistStatusUpdated
          receipt: true
      file: ./src/mappings/fleetCommander.ts

