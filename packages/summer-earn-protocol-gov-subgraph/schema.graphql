type Proposal @entity {
    id: ID!
    targets: [String!]!
    values: [BigInt!]!
    calldatas: [Bytes!]!
    description: String!
    descriptionHash: Bytes!
    status: String!
    chains: [String!]!
    dstIds: [String!]!
    eta: BigInt!
    createdAt: BigInt!
    governor: String!
}

type CrossChainProposal @entity {
  id: ID!
  proposalId: String!
  chainId: String!
  status: String!
  salt: Bytes!
  targets: [String!]!
  values: [BigInt!]!
  calldatas: [Bytes!]!
  eta: BigInt!
}

type CrossChainProposalByCallId @entity {
  id: ID!
  callId: String!
  proposal: CrossChainProposal!
}

type Role @entity {
  id: ID!
  name: String!
  owner: String!
  targetContract: String!
  accessController: String!
  createdTimestamp: BigInt!
  createdBlockNumber: BigInt!
  active: Boolean!
  events: [RoleEvent!]! @derivedFrom(field: "role")
}

type RoleEvent @entity @transaction {
  id: ID!
  hash: String!
  logIndex: Int!
  timestamp: BigInt!
  blockNumber: BigInt!
  caller: String!
  action: RoleAction!
  role: Role!
}

enum RoleAction {
  GRANT_ROLE
  REVOKE_ROLE
}