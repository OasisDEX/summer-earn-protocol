type Proposal @entity {
    id: ID!
    targets: [String!]!
    values: [BigInt!]!
    calldatas: [Bytes!]!
    description: String!
    descriptionHash: Bytes!
    status: String!
    chains: [String!]!
    dstIds: [String!]!
    eta: BigInt!
    createdAt: BigInt!
}

type CrossChainProposal @entity {
  id: ID!
  proposalId: String!
  chainId: String!
  status: String!
  salt: Bytes!
  targets: [String!]!
  values: [BigInt!]!
  calldatas: [Bytes!]!
  eta: BigInt!
}

type CrossChainProposalByCallId @entity {
  id: ID!
  callId: String!
  proposal: CrossChainProposal!
}