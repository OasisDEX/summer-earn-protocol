type Proposal @entity(immutable: false) {
    id: ID!
    targets: [String!]!
    values: [BigInt!]!
    calldatas: [Bytes!]!
    description: String!
    descriptionHash: Bytes!
    status: String!
    chains: [String!]!
    dstIds: [String!]!
    eta: BigInt!
    createdAt: BigInt!
    governor: String!
    voteStart: BigInt!
    voteEnd: BigInt!
    quorum: BigInt!
    forVotes: BigInt!
    againstVotes: BigInt!
    abstainVotes: BigInt!
    votes: [Vote!]! @derivedFrom(field: "proposal")
}

type Vote @entity(immutable: true) {
    id: ID! # hash + logIndex
    proposal: Proposal!
    voter: String!
    support: Int! # 0: Against, 1: For, 2: Abstain
    votes: BigInt!
    reason: String!
    params: Bytes
    blockNumber: BigInt!
    timestamp: BigInt!
}

type CrossChainProposal @entity(immutable: false) {
  id: ID!
  proposalId: String!
  chainId: String!
  status: String!
  salt: Bytes!
  targets: [String!]!
  values: [BigInt!]!
  calldatas: [Bytes!]!
  eta: BigInt!
}

type CrossChainProposalByCallId @entity(immutable: true) {
  id: ID!
  callId: String!
  proposal: CrossChainProposal!
}

type Role @entity(immutable: false) {
  id: ID!
  name: String!
  owner: String!
  targetContract: String!
  accessController: String!
  createdTimestamp: BigInt!
  createdBlockNumber: BigInt!
  active: Boolean!
  events: [RoleEvent!]! @derivedFrom(field: "role")
}

type RoleEvent @entity  (immutable: true) @transaction{
  id: ID!
  hash: String!
  logIndex: Int!
  timestamp: BigInt!
  blockNumber: BigInt!
  caller: String!
  action: RoleAction!
  role: Role!
}

enum RoleAction  {
  GRANT_ROLE
  REVOKE_ROLE
}

type Delegate @entity(immutable: false) {
  id: ID! # address
  votingPower: BigInt!
  delegationsCount: Int!
}