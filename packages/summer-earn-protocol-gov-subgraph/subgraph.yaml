specVersion: 0.0.8
schema:
  file: ./schema.graphql 
dataSources:
  - kind: ethereum/contract
    name: SummerGovernor
    network: arbitrum-one
    source:
      abi: SummerGovernor
      address: "0xBE5A4DD68c3526F32B454fE28C9909cA0601e9Fa"
      startBlock: 300183921
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
      abis:
        - name: SummerGovernor
          file: ./abis/SummerGovernor.json       
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
          receipt: true
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
          receipt: true
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
          receipt: true
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
          receipt: true
        - event:  ProposalSentCrossChain(indexed uint256,indexed uint32)
          handler: handleProposalSentCrossChain
          receipt: true
        - event: TimelockChange(address,address)
          handler: handleTimelockChange
          receipt: true
        - event: ProposalReceivedCrossChain(indexed uint256,indexed uint32)
          handler: handleProposalReceivedCrossChain
          receipt: true
      file: ./src/mappings/governance.ts
  - kind: ethereum/contract
    name: SummerGovernorV2
    network: arbitrum-one
    source:
      abi: SummerGovernor
      address: "0x94F29e66fE35Ee2BC03EC9D8C3fb6d9E183f3572"
      startBlock: 300183921
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
      abis:
        - name: SummerGovernor
          file: ./abis/SummerGovernor.json       
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
          receipt: true
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
          receipt: true
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
          receipt: true
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
          receipt: true
        - event:  ProposalSentCrossChain(indexed uint256,indexed uint32)
          handler: handleProposalSentCrossChain
          receipt: true
        - event: TimelockChange(address,address)
          handler: handleTimelockChange
          receipt: true
        - event: ProposalReceivedCrossChain(indexed uint256,indexed uint32)
          handler: handleProposalReceivedCrossChain
          receipt: true
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
          receipt: true
        - event: VoteCastWithParams(indexed address,uint256,uint8,uint256,string,bytes)
          handler: handleVoteCastWithParams
          receipt: true
      file: ./src/mappings/governance.ts
  - kind: ethereum/contract
    name: ProtocolAccessManager
    network: arbitrum-one
    source:
      abi: ProtocolAccessManager
      address: "0xf389BCEa078acD9516414F5dabE3dDd5f7e39694"
      startBlock: 300183860
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Role
      abis:
        - name: ProtocolAccessManager
          file: ./abis/ProtocolAccessManager.abi.json
        - name: HarborCommand
          file: ./abis/HarborCommand.abi.json
      eventHandlers:
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
          receipt: true
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
          receipt: true
      file: ./src/mappings/accessManagement.ts  
  - kind: ethereum/contract
    name: SummerGovernanceToken
    network: arbitrum-one
    source:
      abi: Votes
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 300180000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Delegate
      abis:
        - name: Votes
          file: ./abis/Votes.json
      eventHandlers:
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: handleDelegateChanged
        - event: DelegateVotesChanged(indexed address,uint256,uint256)
          handler: handleDelegateVotesChanged
      file: ./src/mappings/votes.ts
  - kind: ethereum/contract
    name: TimelockController
    network: arbitrum-one
    source:
      abi: SummerTimelockController
      address: "0x447bf9d1485abdc4c1778025dfdfbe8b894c3796"
      startBlock: 300180000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
      abis:
        - name: SummerTimelockController
          file: ./abis/SummerTimelockController.json 
      eventHandlers:
        - event: CallExecuted(indexed bytes32,indexed uint256,address,uint256,bytes)
          handler: handleCallExecuted
          receipt: true
        - event: CallSalt(indexed bytes32,bytes32)  
          handler: handleCallSalt
          receipt: true
        - event: CallScheduled(indexed bytes32,indexed uint256,address,uint256,bytes,bytes32,uint256)
          handler: handleCallScheduled
          receipt: true
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleTimelockRoleGranted
          receipt: true
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleTimelockRoleRevoked
          receipt: true
      file: ./src/mappings/timelock.ts
templates:
  - kind: ethereum/contract
    name: TimelockControllerTemplate
    network: arbitrum-one
    source:
