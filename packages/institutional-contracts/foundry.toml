[profile.default]
src = "src"
out = "out"
libs = [
  'node_modules', 
  'lib'
]
test = 'test'
cache_path  = 'cache_forge'
solc = "0.8.28"
evm_version = "cancun"
cbor_metadata = true

[fmt]
  bracket_spacing = true
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "remove"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true
  sort_imports = true
  contract_new_lines = true

