specVersion: 0.0.8
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ConfigManager
    network: sonic-mainnet
    source:
      abi: ConfigManager
      address: "0xDff0fc7bFa32Fb536807820FB3Be6C9828463e32"
      startBlock: 14240174
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
      abis:
        - name: ConfigManager
          file: ./abis/ConfigManager.abi.json
      eventHandlers:
        - event: RaftUpdated(address,address)
          handler: handleRaftUpdated
          receipt: true
      file: ./src/mappings/configManager.ts

  - kind: ethereum/contract
    name: InstitutionalVaultRegistry
    network: sonic-mainnet
    source:
      abi: InstitutionalVaultRegistry
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 14240174
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
      abis:
        - name: InstitutionalVaultRegistry
          file: ./abis/InstitutionalVaultRegistry.abi.json
        - name: ConfigManager
          file: ./abis/ConfigManager.abi.json
      eventHandlers:
        - event: InstitutionAdded(indexed bytes32,address,address,address)
          handler: handleInstitutionAdded
          receipt: true
      file: ./src/mappings/institutionalVaultRegistry.ts
templates:
  - kind: ethereum/contract
    name: Raft
    network: sonic-mainnet
    source:
      abi: Raft
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
      abis:
        - name: Raft
          file: ./abis/Raft.abi.json
        - name: ERC20
          file: ./abis/common/ERC20.json
        - name: OneInchOracle
          file: ./abis/oracles/one-inch-oracle.json
        - name: AaveV3Oracle
          file: ./abis/oracles/aave-v3-oracle.json
        - name: SdaiOracle
          file: ./abis/oracles/sdai-oracle.json
        - name: FeedRegistry
          file: ./abis/oracles/feed-registry.json
        - name: SusdeOracle
          file: ./abis/oracles/susde-oracle.json
        - name: SparkOracle
          file: ./abis/oracles/spark-oracle.json
        - name: AaveV2Oracle
          file: ./abis/oracles/aave-v2-price-oracle.json
        - name: Ark
          file: ./abis/Ark.abi.json
        - name: FleetCommander
          file: ./abis/FleetCommander.abi.json
      eventHandlers:
        - event:  ArkRewardTokenAuctionStarted(uint256,address,address,uint256)
          handler: handleArkRewardTokenAuctionStarted
          receipt: true
        - event: AuctionFinalized(indexed uint256,uint256,uint256)
          handler: handleAuctionFinalized
          receipt: true
        - event:  TokensPurchased(indexed uint256,indexed address,uint256,uint256)
          handler: handleTokensPurchased
          receipt: true
        - event:  ArkAuctionParametersSet(indexed address,indexed address,(uint40,uint256,uint256,uint256,uint8))
          handler: handleArkAuctionParametersSet
          receipt: true
      file: ./src/mappings/raft.ts
  - kind: ethereum/contract
    name: ConfigManager
    network: sonic-mainnet
    source:
      abi: ConfigManager
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
      abis:
        - name: ConfigManager
          file: ./abis/ConfigManager.abi.json
      eventHandlers:
        - event: RaftUpdated(address,address)
          handler: handleRaftUpdated
          receipt: true
      file: ./src/mappings/configManager.ts      