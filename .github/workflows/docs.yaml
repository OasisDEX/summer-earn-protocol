name: Docs
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**/src/**/*.sol'
      - 'packages/**/contracts/**/*.sol'
      - 'packages/**/foundry.toml'
      - 'gitbook/**'
      - 'scripts/docs/**'
      - '.gitbook.yaml'
  push:
    branches: [main]

jobs:
  drift-check:
    name: Generated docs drift check
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 10.32.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.7.0
        with:
          # pinned: forge doc output format may change between versions,
          # which would make the drift check flap
          version: v1.5.1

      - name: Regenerate docs and check for drift
        run: |
          pnpm docs:build
          if ! git diff --exit-code -- gitbook/; then
            echo '::error::gitbook/ is stale. Run `pnpm docs:build` locally and commit the result.'
            exit 1
          fi

  regen-safety-net:
    name: Regenerate docs on main
    if: github.event_name == 'push'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT }}

      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 10.32.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.7.0
        with:
          version: v1.5.1

      - name: Regenerate and push if stale
        run: |
          pnpm docs:build
          if ! git diff --quiet -- gitbook/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gitbook/
            git commit -m "docs: regenerate contract reference [skip ci]"
            git push
          fi
