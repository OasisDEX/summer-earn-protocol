name: Build and Unit Test
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main
      - dev
jobs:
  build:
    name: Build and Unit Test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key:
            ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}-${{
            github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-

      - uses: pnpm/action-setup@v2.0.1
        with:
          version: 10.32.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache solc
        uses: actions/cache@v4
        with:
          path: ~/.svm
          key: ${{ runner.os }}-svm-${{ hashFiles('packages/**/foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-svm-     

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            packages/*/cache_forge
            packages/*/out
          key: ${{ runner.os }}-foundry-${{ hashFiles('packages/**/*.sol', 'packages/**/foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

        
      - name: Test
        run: pnpm test
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          SONIC_RPC_URL: ${{ secrets.SONIC_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          HYPERLIQUID_RPC_URL: ${{ secrets.HYPERLIQUID_RPC_URL }}

      - name: Generate coverage reports
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          SONIC_RPC_URL: ${{ secrets.SONIC_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          HYPERLIQUID_RPC_URL: ${{ secrets.HYPERLIQUID_RPC_URL }}
          FOUNDRY_FUZZ_RUNS: 1
        run: pnpm turbo run coverage:lcov

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            ./packages/core-contracts/lcov.info
            ./packages/access-contracts/lcov.info
            ./packages/rewards-contracts/lcov.info
            ./packages/gov-contracts/lcov.info
            ./packages/voting-decay/lcov.info
          flags: unittests
          name: codecov-umbrella

