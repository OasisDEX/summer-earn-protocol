name: Build and Unit Test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    name: Build and Unit Test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Restore turbo build setup
        uses: actions/cache/restore@v5
        with:
          path: |
            .turbo
            node_modules/.cache/turbo 
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-

      - name: Restore solc
        uses: actions/cache/restore@v5
        with:
          path: ~/.svm
          key: ${{ runner.os }}-svm-${{ hashFiles('packages/**/foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-svm-     

      - name: Restore Foundry build artifacts
        uses: actions/cache/restore@v5
        with:
          path: |
            packages/*/cache_forge
            packages/*/out
          key: ${{ runner.os }}-foundry-${{ hashFiles('packages/**/*.sol', 'packages/**/foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      # 2. RUN ENVIRONMENT & TESTS
      - uses: pnpm/action-setup@v5.0.0
        with:
          version: 10.32.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          trivy-config: '.trivy.yaml'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.7.0

      - name: Lint & Format
        run: |
          pnpm lint
          pnpm format

      - name: Run Tests (PR only)
        if: github.event_name == 'pull_request'
        run: pnpm test
        env:
          TURBO_NO_DAEMON: true 
          CI: true
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          SONIC_RPC_URL: ${{ secrets.SONIC_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          HYPERLIQUID_RPC_URL: ${{ secrets.HYPERLIQUID_RPC_URL }}

      - name: Generate coverage reports (Main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm coverage:lcov
        env:
          TURBO_NO_DAEMON: true
          CI: true          
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          SONIC_RPC_URL: ${{ secrets.SONIC_RPC_URL }}
          OPTIMISM_RPC_URL: ${{ secrets.OPTIMISM_RPC_URL }}
          HYPERLIQUID_RPC_URL: ${{ secrets.HYPERLIQUID_RPC_URL }}
          FOUNDRY_FUZZ_RUNS: 1

      - name: Upload coverage report to Codecov (Main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/**/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Save turbo build setup
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .turbo
            node_modules/.cache/turbo 
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Save solc
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.svm
          key: ${{ runner.os }}-svm-${{ hashFiles('packages/**/foundry.toml') }}

      - name: Save Foundry build artifacts
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            packages/*/cache_forge
            packages/*/out
          key: ${{ runner.os }}-foundry-${{ hashFiles('packages/**/*.sol', 'packages/**/foundry.toml') }}